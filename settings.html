<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto py-8 px-4">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Account Settings</h1>
            <button id="logoutBtn" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
                Log Out
            </button>
        </header>

        <!-- Main Content -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex flex-col md:flex-row gap-8">
                <!-- Profile Picture Section -->
                <div class="md:w-1/3">
                    <h2 class="text-xl font-semibold mb-4">Profile Picture</h2>
                    <div class="flex flex-col items-center">
                        <img id="userImage" src="/default-avatar.png" alt="Profile" 
                             class="w-40 h-40 rounded-full object-cover border-4 border-blue-200 mb-4">
                        <input type="file" id="imageUpload" accept="image/*" class="hidden">
                        <button id="uploadBtn" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                            Change Photo
                        </button>
                        <p class="text-sm text-gray-500 mt-2">JPG, GIF or PNG. Max 5MB.</p>
                    </div>
                </div>

                <!-- Account Details Section -->
                <div class="md:w-2/3">
                    <h2 class="text-xl font-semibold mb-4">Account Details</h2>
                    <form id="profileForm">
                        <div class="mb-4">
                            <label for="username" class="block text-gray-700 mb-2">Username</label>
                            <input type="text" id="username" name="username" required
                                   class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="mb-4">
                            <label for="email" class="block text-gray-700 mb-2">Email</label>
                            <input type="email" id="email" name="email" required
                                   class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <button type="submit" id="saveProfileBtn" 
                                class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
                            Save Changes
                        </button>
                        <span id="profileSpinner" class="spinner hidden"></span>
                    </form>

                    <!-- Change Password Section -->
                    <div class="mt-8 pt-6 border-t">
                        <h2 class="text-xl font-semibold mb-4">Change Password</h2>
                        <form id="passwordForm">
                            <div class="mb-4">
                                <label for="currentPassword" class="block text-gray-700 mb-2">Current Password</label>
                                <input type="password" id="currentPassword" name="currentPassword" required
                                       class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="mb-4">
                                <label for="newPassword" class="block text-gray-700 mb-2">New Password</label>
                                <input type="password" id="newPassword" name="newPassword" required minlength="6"
                                       class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="mb-4">
                                <label for="confirmPassword" class="block text-gray-700 mb-2">Confirm New Password</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
                                       class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <button type="submit" id="changePasswordBtn"
                                    class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                                Change Password
                            </button>
                            <span id="passwordSpinner" class="spinner hidden"></span>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Message -->
        <div id="statusMessage" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 rounded shadow-lg hidden"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Backend configuration
        const BACKEND_BASE_URL = 'https://gameappbackend-i8zv.onrender.com/api';
        
        // Elements
        const userImage = document.getElementById('userImage');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const profileForm = document.getElementById('profileForm');
        const passwordForm = document.getElementById('passwordForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const imageUpload = document.getElementById('imageUpload');
        const logoutBtn = document.getElementById('logoutBtn');
        const statusMessage = document.getElementById('statusMessage');

        // Check authentication
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'index.html';
            return;
        }

        // Load user data
        async function loadUserData() {
            try {
                const response = await fetch(`${BACKEND_BASE_URL}/user/profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        logout();
                    }
                    throw new Error('Failed to load profile');
                }

                const userData = await response.json();
                
                usernameInput.value = userData.username || '';
                emailInput.value = userData.email || '';
                
                if (userData.image) {
                    userImage.src = `${BACKEND_BASE_URL.replace('/api', '')}${userData.image}`;
                }
            } catch (error) {
                showMessage('Error loading profile: ' + error.message, 'error');
            }
        }

        // Update profile
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveProfileBtn');
            const spinner = document.getElementById('profileSpinner');
            
            saveBtn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`${BACKEND_BASE_URL}/user/profile/update`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        username: usernameInput.value.trim(),
                        email: emailInput.value.trim()
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Profile updated successfully!');
                    const user = JSON.parse(localStorage.getItem('user'));
                    user.username = data.user.username;
                    user.email = data.user.email;
                    localStorage.setItem('user', JSON.stringify(user));
                } else {
                    throw new Error(data.message || 'Failed to update profile');
                }
            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });

        // Change password
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            const changeBtn = document.getElementById('changePasswordBtn');
            const spinner = document.getElementById('passwordSpinner');
            
            changeBtn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`${BACKEND_BASE_URL}/user/password/update`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        currentPassword: document.getElementById('currentPassword').value,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Password changed successfully!');
                    passwordForm.reset();
                } else {
                    throw new Error(data.message || 'Failed to change password');
                }
            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                changeBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });

        // Upload profile image
        uploadBtn.addEventListener('click', () => imageUpload.click());
        
        imageUpload.addEventListener('change', async () => {
            const file = imageUpload.files[0];
            if (!file) return;

            if (!file.type.match('image.*')) {
                showMessage('Please select an image file', 'error');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showMessage('Image must be less than 5MB', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('profileImage', file);

            try {
                const response = await fetch(`${BACKEND_BASE_URL}/user/upload-image`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Profile image updated!');
                    userImage.src = `${BACKEND_BASE_URL.replace('/api', '')}${data.imageUrl}`;
                    
                    const user = JSON.parse(localStorage.getItem('user'));
                    user.image = data.imageUrl;
                    localStorage.setItem('user', JSON.stringify(user));
                } else {
                    throw new Error(data.message || 'Failed to upload image');
                }
            } catch (error) {
                showMessage(error.message, 'error');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', logout);

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        function showMessage(message, type = 'success') {
            statusMessage.textContent = message;
            statusMessage.className = `fixed bottom-4 right-4 px-4 py-2 rounded shadow-lg ${type === 'error' ? 'bg-red-500' : 'bg-green-500'} text-white`;
            statusMessage.classList.remove('hidden');
            
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 3000);
        }

        // Initial load
        await loadUserData();
    });
    </script>
</body>
</html>
