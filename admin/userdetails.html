<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <header class="bg-gray-800 text-white p-6 rounded-lg mb-8">
            <h1 class="text-2xl font-bold">User Management Dashboard</h1>
        </header>

        <!-- Filter Section -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Filter Users</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" placeholder="Search by username" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="text" id="email" placeholder="Search by email" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Verification Status</label>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center">
                            <input type="checkbox" id="verified" checked 
                                   class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                            <label for="verified" class="ml-2 text-sm text-gray-700">Verified</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="not-verified" checked 
                                   class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                            <label for="not-verified" class="ml-2 text-sm text-gray-700">Not Verified</label>
                        </div>
                    </div>
                </div>
                <div>
                    <label for="sort" class="block text-sm font-medium text-gray-700 mb-1">Sort By</label>
                    <select id="sort" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="username-asc">Username (A-Z)</option>
                        <option value="username-desc">Username (Z-A)</option>
                    </select>
                </div>
            </div>
            
            <div class="flex space-x-3">
                <button id="apply-filters" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Apply Filters
                </button>
                <button id="reset-filters" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                    Reset Filters
                </button>
            </div>
        </div>

        <!-- Table Section -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-800">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Avatar</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">User ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Username</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Email</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Status</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Joined Date</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="px-6 py-3 flex items-center justify-between border-t border-gray-200">
                <div class="flex-1 flex justify-between sm:hidden">
                    <button id="prev-page-mobile" class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                        Previous
                    </button>
                    <button id="next-page-mobile" class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                        Next
                    </button>
                </div>
                <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                    <div>
                        <p id="page-info" class="text-sm text-gray-700">
                            Showing <span class="font-medium">1</span> to <span class="font-medium">5</span> of <span class="font-medium">6</span> results
                        </p>
                    </div>
                    <div>
                        <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                            <button id="prev-page" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                <span class="sr-only">Previous</span>
                                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                                </svg>
                            </button>
                            <button id="next-page" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                <span class="sr-only">Next</span>
                                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="edit-modal" class="fixed z-10 inset-0 overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <div class="flex justify-between items-center">
                                <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Edit User</h3>
                                <button type="button" class="close text-gray-400 hover:text-gray-500">
                                    <span class="sr-only">Close</span>
                                    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                            <div class="mt-4">
                                <form id="edit-user-form">
                                    <input type="hidden" id="edit-user-id">
                                    <div class="mb-4">
                                        <label for="edit-username" class="block text-sm font-medium text-gray-700">Username <span class="text-red-500">*</span></label>
                                        <input type="text" id="edit-username" required
                                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>
                                    <div class="mb-4">
                                        <label for="edit-email" class="block text-sm font-medium text-gray-700">Email <span class="text-red-500">*</span></label>
                                        <input type="email" id="edit-email" required
                                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>
                                    <div class="mb-4">
                                        <div class="flex items-center">
                                            <input type="checkbox" id="edit-verified"
                                                   class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                                            <label for="edit-verified" class="ml-2 block text-sm text-gray-700">Verified</label>
                                        </div>
                                    </div>
                                    <div class="flex justify-end space-x-3">
                                        <button type="button" id="cancel-edit" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                                            Cancel
                                        </button>
                                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                                            Save Changes
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed z-10 inset-0 overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <div class="flex justify-between items-center">
                                <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Confirm Deletion</h3>
                                <button type="button" class="close text-gray-400 hover:text-gray-500">
                                    <span class="sr-only">Close</span>
                                    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                            <div class="mt-4">
                                <p class="text-sm text-gray-500">Are you sure you want to delete this user? This action cannot be undone.</p>
                                <input type="hidden" id="delete-user-id">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button id="confirm-delete" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:ml-3 sm:w-auto sm:text-sm">
                        Delete
                    </button>
                    <button id="cancel-delete" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample data - in a real app, you would fetch this from your API
        const sampleUsers = [
            {
                "_id": "684fe95e077bdb3801f630bb",
                "username": "sakthivel",
                "email": "sakthivelv202222@gmail.com",
                "isVerified": true,
                "createdAt": "2025-06-16T09:52:30.171Z",
                "updatedAt": "2025-06-17T04:13:50.530Z",
                "__v": 0,
                "image": "/uploads/profileImage-1750133630030-973799599.jpg"
            },
            {
                "_id": "685064d94174e9e2f764b004",
                "username": "sakthivelkj",
                "email": "yatyathishbabu950@gmail.com",
                "isVerified": true,
                "image": "default-avatar.png",
                "createdAt": "2025-06-16T18:39:21.658Z",
                "updatedAt": "2025-06-16T18:39:52.012Z",
                "__v": 0
            },
            {
                "_id": "6851cb6aef050f5fe7d6686c",
                "username": "hutrdtfygvbhj",
                "email": "sakthi@gmail.com",
                "isVerified": false,
                "image": "default-avatar.png",
                "createdAt": "2025-06-17T20:09:14.269Z",
                "updatedAt": "2025-06-17T20:09:14.269Z",
                "__v": 0
            },
            {
                "_id": "6851eaec9c0f22232c06b16b",
                "username": "sakthiveliohuy",
                "email": "sakthivel@gmail.com",
                "isVerified": false,
                "image": "default-avatar.png",
                "createdAt": "2025-06-17T22:23:40.122Z",
                "updatedAt": "2025-06-17T22:23:40.122Z",
                "__v": 0
            },
            {
                "_id": "68530cb84b4574e28c751a28",
                "username": "727823tucs256",
                "email": "727823tucs256@skct.edu.in",
                "isVerified": true,
                "image": "default-avatar.png",
                "createdAt": "2025-06-18T19:00:08.530Z",
                "updatedAt": "2025-06-18T19:00:34.830Z",
                "__v": 0
            },
            {
                "_id": "6853f36486ab6f830f6f32a1",
                "username": "bharathi",
                "email": "bharathi5554r@gmail.com",
                "isVerified": true,
                "image": "default-avatar.png",
                "createdAt": "2025-06-19T11:24:20.989Z",
                "updatedAt": "2025-06-19T11:24:43.781Z",
                "__v": 0
            }
        ];

        // DOM elements
        const usersTableBody = document.getElementById('users-table-body');
        const usernameFilter = document.getElementById('username');
        const emailFilter = document.getElementById('email');
        const verifiedFilter = document.getElementById('verified');
        const notVerifiedFilter = document.getElementById('not-verified');
        const sortSelect = document.getElementById('sort');
        const applyFiltersBtn = document.getElementById('apply-filters');
        const resetFiltersBtn = document.getElementById('reset-filters');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const prevPageBtnMobile = document.getElementById('prev-page-mobile');
        const nextPageBtnMobile = document.getElementById('next-page-mobile');
        const pageInfo = document.getElementById('page-info');
        const editModal = document.getElementById('edit-modal');
        const deleteModal = document.getElementById('delete-modal');
        const editForm = document.getElementById('edit-user-form');
        const cancelEditBtn = document.getElementById('cancel-edit');
        const confirmDeleteBtn = document.getElementById('confirm-delete');
        const cancelDeleteBtn = document.getElementById('cancel-delete');
        const closeButtons = document.querySelectorAll('.close');

        // State
        let currentPage = 1;
        const usersPerPage = 5;
        let filteredUsers = [...sampleUsers];

        // Initialize
        function init() {
            renderUsers();
            setupEventListeners();
        }

        // Set up event listeners
        function setupEventListeners() {
            applyFiltersBtn.addEventListener('click', applyFilters);
            resetFiltersBtn.addEventListener('click', resetFilters);
            prevPageBtn.addEventListener('click', goToPrevPage);
            nextPageBtn.addEventListener('click', goToNextPage);
            prevPageBtnMobile.addEventListener('click', goToPrevPage);
            nextPageBtnMobile.addEventListener('click', goToNextPage);
            
            // Modal close buttons
            closeButtons.forEach(closeBtn => {
                closeBtn.addEventListener('click', () => {
                    editModal.classList.add('hidden');
                    deleteModal.classList.add('hidden');
                });
            });
            
            cancelEditBtn.addEventListener('click', () => editModal.classList.add('hidden'));
            cancelDeleteBtn.addEventListener('click', () => deleteModal.classList.add('hidden'));
            
            editForm.addEventListener('submit', handleEditSubmit);
            confirmDeleteBtn.addEventListener('click', handleDeleteConfirm);
            
            // Close modal when clicking outside
            window.addEventListener('click', (event) => {
                if (event.target === editModal) editModal.classList.add('hidden');
                if (event.target === deleteModal) deleteModal.classList.add('hidden');
            });
        }

        // Apply filters
        function applyFilters() {
            currentPage = 1;
            filteredUsers = sampleUsers.filter(user => {
                const usernameMatch = !usernameFilter.value || 
                    user.username.toLowerCase().includes(usernameFilter.value.toLowerCase());
                const emailMatch = !emailFilter.value || 
                    user.email.toLowerCase().includes(emailFilter.value.toLowerCase());
                const verifiedMatch = (verifiedFilter.checked && user.isVerified) || 
                    (notVerifiedFilter.checked && !user.isVerified);
                
                return usernameMatch && emailMatch && verifiedMatch;
            });

            // Apply sorting
            sortUsers();
            
            renderUsers();
        }

        // Sort users
        function sortUsers() {
            const sortValue = sortSelect.value;
            
            filteredUsers.sort((a, b) => {
                switch(sortValue) {
                    case 'newest':
                        return new Date(b.createdAt) - new Date(a.createdAt);
                    case 'oldest':
                        return new Date(a.createdAt) - new Date(b.createdAt);
                    case 'username-asc':
                        return a.username.localeCompare(b.username);
                    case 'username-desc':
                        return b.username.localeCompare(a.username);
                    default:
                        return 0;
                }
            });
        }

        // Reset filters
        function resetFilters() {
            usernameFilter.value = '';
            emailFilter.value = '';
            verifiedFilter.checked = true;
            notVerifiedFilter.checked = true;
            sortSelect.value = 'newest';
            
            currentPage = 1;
            filteredUsers = [...sampleUsers];
            sortUsers();
            renderUsers();
        }

        // Pagination functions
        function goToPrevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderUsers();
            }
        }

        function goToNextPage() {
            if (currentPage * usersPerPage < filteredUsers.length) {
                currentPage++;
                renderUsers();
            }
        }

        // Render users to the table
        function renderUsers() {
            const startIndex = (currentPage - 1) * usersPerPage;
            const endIndex = startIndex + usersPerPage;
            const usersToDisplay = filteredUsers.slice(startIndex, endIndex);
            
            usersTableBody.innerHTML = '';
            
            if (usersToDisplay.length === 0) {
                usersTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-4 text-center text-sm text-gray-500">No users found matching your criteria</td>
                    </tr>
                `;
                return;
            }
            
            usersToDisplay.forEach(user => {
                const row = document.createElement('tr');
                
                const avatarSrc = user.image.includes('default-avatar.png') ? 
                    'https://via.placeholder.com/40' : user.image;
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <img src="${avatarSrc}" alt="${user.username}" class="h-10 w-10 rounded-full">
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-mono text-gray-500">${user._id}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${user.username}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${user.email}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${user.isVerified ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${user.isVerified ? 'Verified' : 'Not Verified'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${new Date(user.createdAt).toLocaleDateString()}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button class="edit-btn text-indigo-600 hover:text-indigo-900 mr-3" data-id="${user._id}">Edit</button>
                        <button class="delete-btn text-red-600 hover:text-red-900" data-id="${user._id}">Delete</button>
                    </td>
                `;
                
                usersTableBody.appendChild(row);
            });
            
            // Add event listeners to action buttons
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => openEditModal(btn.dataset.id));
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => openDeleteModal(btn.dataset.id));
            });
            
            // Update pagination info
            const totalPages = Math.ceil(filteredUsers.length / usersPerPage);
            const startUser = (currentPage - 1) * usersPerPage + 1;
            const endUser = Math.min(currentPage * usersPerPage, filteredUsers.length);
            
            pageInfo.innerHTML = `Showing <span class="font-medium">${startUser}</span> to <span class="font-medium">${endUser}</span> of <span class="font-medium">${filteredUsers.length}</span> results`;
            
            // Disable/enable pagination buttons
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages || totalPages === 0;
            prevPageBtnMobile.disabled = currentPage === 1;
            nextPageBtnMobile.disabled = currentPage === totalPages || totalPages === 0;
        }

        // Modal functions
        function openEditModal(userId) {
            const user = filteredUsers.find(u => u._id === userId);
            if (!user) return;
            
            document.getElementById('edit-user-id').value = user._id;
            document.getElementById('edit-username').value = user.username;
            document.getElementById('edit-email').value = user.email;
            document.getElementById('edit-verified').checked = user.isVerified;
            
            editModal.classList.remove('hidden');
        }

        function openDeleteModal(userId) {
            document.getElementById('delete-user-id').value = userId;
            deleteModal.classList.remove('hidden');
        }

        // Form handlers
        function handleEditSubmit(e) {
            e.preventDefault();
            
            const userId = document.getElementById('edit-user-id').value;
            const username = document.getElementById('edit-username').value;
            const email = document.getElementById('edit-email').value;
            const isVerified = document.getElementById('edit-verified').checked;
            
            // Validate required fields
            if (!username || !email) {
                alert('Please fill in all required fields');
                return;
            }
            
            // In a real app, you would make an API call here
            // Example: axios.put(`/updateuser/${userId}`, { username, email, isVerified })
            
            // For this demo, we'll update the local data
            const userIndex = sampleUsers.findIndex(u => u._id === userId);
            if (userIndex !== -1) {
                sampleUsers[userIndex] = {
                    ...sampleUsers[userIndex],
                    username,
                    email,
                    isVerified,
                    updatedAt: new Date().toISOString()
                };
            }
            
            // Reapply filters and render
            applyFilters();
            editModal.classList.add('hidden');
        }

        function handleDeleteConfirm() {
            const userId = document.getElementById('delete-user-id').value;
            
            // In a real app, you would make an API call here
            // Example: axios.delete(`/deleteuser/${userId}`)
            
            // For this demo, we'll update the local data
            const userIndex = sampleUsers.findIndex(u => u._id === userId);
            if (userIndex !== -1) {
                sampleUsers.splice(userIndex, 1);
            }
            
            // Reapply filters and render
            applyFilters();
            deleteModal.classList.add('hidden');
        }

        // Initialize the app
        init();
    </script>
</body>
</html>
