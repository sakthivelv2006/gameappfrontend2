<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Course Topics</title>
<style>
  :root{--bg:#f6f8fa;--card:#fff;--muted:#6b7280;--accent:#0366d6}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);margin:0;padding:24px;color:#111}
  .container{max-width:1100px;margin:0 auto}
  h1{text-align:center;margin:0 0 18px}
  .course-card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 20px rgba(13,38,76,0.08);display:flex;gap:18px;align-items:center}
  .course-image{width:160px;height:100px;border-radius:8px;object-fit:cover;background:#eee}
  .course-info{flex:1}
  .course-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:14px}
  .badge{background:#eef8ff;color:var(--accent);padding:6px 10px;border-radius:999px;font-weight:600}
  .notice{margin-top:12px;padding:10px;border-radius:8px;background:#fff3cd;color:#856404}
  .topics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:18px}
  .topic-card{background:var(--card);padding:14px;border-radius:10px;box-shadow:0 6px 16px rgba(12,34,56,0.06);transition:transform .12s}
  .topic-card:hover{transform:translateY(-6px)}
  .topic-title{font-size:16px;margin:0 0 8px}
  .topic-meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .btn{background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;border:none;cursor:pointer;text-decoration:none;display:inline-block}
  .empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);border-radius:10px}
  @media (max-width:640px){.course-card{flex-direction:column;align-items:flex-start}.course-image{width:100%;height:160px}}
</style>
</head>
<body>
<div class="container">
  <h1>Course Topics</h1>
  <div id="courseWrapper"></div>
  <div id="topicsContainer"></div>
</div>
<script>
const BASE_API = "http://localhost:5000/api";
function qs(name){return new URLSearchParams(location.search).get(name)}
async function init(){
  const courseId = qs('courseId') || '';
  const cw = document.getElementById('courseWrapper');
  const tc = document.getElementById('topicsContainer');
  if(!courseId){cw.innerHTML = '<div class="empty">Missing courseId in URL. Append ?courseId=YOUR_ID</div>';return}
  try{
    const [cRes,tRes] = await Promise.all([
      fetch(`${BASE_API}/courses/${courseId}`),
      fetch(`${BASE_API}/coursesTopics/course/${courseId}`)
    ]);
    if(!cRes.ok){cw.innerHTML = `<div class="empty">Course not found (status ${cRes.status})</div>`;return}
    const course = await cRes.json();
    const topics = tRes.ok ? await tRes.json() : [];
    const now = new Date();
    const end = new Date(course.endDate);
    const start = new Date(course.startDate);
    const isBeforeEnd = now < end;
    cw.innerHTML = `
      <div class="course-card">
        <img class="course-image" src="${course.imageUrl || ''}" alt="${course.title || ''}" onerror="this.style.display='none'">
        <div class="course-info">
          <div style="display:flex;align-items:center;gap:12px">
            <h2 style="margin:0">${course.title || 'Untitled Course'}</h2>
            <div class="badge">₹${course.price ?? 0}</div>
            <div style="margin-left:auto;font-weight:600">${course.level || ''}</div>
          </div>
          <div class="course-meta">
            <div>Instructor: ${course.instructor || 'N/A'}</div>
            <div>Category: ${course.category || 'N/A'}</div>
            <div>Duration: ${course.duration ?? 'N/A'}</div>
            <div>Start: ${course.startDate ? new Date(course.startDate).toLocaleDateString() : 'N/A'}</div>
            <div>End: ${course.endDate ? new Date(course.endDate).toLocaleDateString() : 'N/A'}</div>
          </div>
          <p style="margin:12px 0 0;color:#333">${course.description || ''}</p>
          <div class="notice">${isBeforeEnd ? 'Feel free to learn before the end date.' : 'This course has ended.'}</div>
        </div>
      </div>
    `;
    if(!topics || topics.length === 0){tc.innerHTML = '<div class="empty">No topics found for this course.</div>';return}
    const grid = document.createElement('div');grid.className='topics-grid';
    topics.forEach(t=>{
      const card = document.createElement('div');card.className='topic-card';
      card.innerHTML = `
        <h3 class="topic-title">${t.topicName || t.title || 'Untitled'}</h3>
        <div class="topic-meta">Order: ${t.order ?? 'N/A'} · Created: ${t.createdAt ? new Date(t.createdAt).toLocaleString() : 'N/A'}</div>
        <p style="margin:0 0 12px;color:#222">${t.videoUrl ? 'Includes video resource' : (t.content || t.description || 'No description available')}</p>
        ${t.videoUrl ? `<a class="btn" href="${t.videoUrl}" target="_blank" rel="noopener">Watch Video</a>` : ''}
      `;
      grid.appendChild(card);
    });
    tc.innerHTML='';tc.appendChild(grid);
  }catch(e){
    cw.innerHTML = '<div class="empty">Error loading data.</div>';tc.innerHTML='';
  }
}
init();
</script>
</body>
</html>
