<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Courses</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3a0ca3;
      --accent: #f72585;
      --light: #f8f9fa;
      --dark: #212529;
      --success: #4cc9f0;
      --warning: #ffd166;
      --danger: #ef476f;
      --gray: #6c757d;
      --light-gray: #e9ecef;
      --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --transition: all 0.3s ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
      padding: 0;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--light-gray);
    }
    
    .logo {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
    }
    
    .logo i {
      margin-right: 10px;
      color: var(--accent);
    }
    
    .user-info {
      display: flex;
      align-items: center;
      background: white;
      padding: 10px 15px;
      border-radius: 50px;
      box-shadow: var(--card-shadow);
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 10px;
    }
    
    .page-title {
      text-align: center;
      margin: 30px 0;
      color: var(--dark);
      font-size: 2.5rem;
      position: relative;
      padding-bottom: 15px;
    }
    
    .page-title:after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
    }
    
    .filters {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
    }
    
    .search-box {
      flex: 1;
      margin-right: 20px;
      position: relative;
    }
    
    .search-box input {
      width: 100%;
      padding: 12px 20px 12px 45px;
      border: 1px solid var(--light-gray);
      border-radius: 8px;
      font-size: 16px;
      transition: var(--transition);
    }
    
    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }
    
    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
    }
    
    .filter-select {
      padding: 12px 20px;
      border: 1px solid var(--light-gray);
      border-radius: 8px;
      font-size: 16px;
      background: white;
      color: var(--dark);
      margin-right: 15px;
      min-width: 150px;
    }
    
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }
    
    .course-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      transition: var(--transition);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
    
    .course-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--card-shadow);
    }
    
    .course-image {
      height: 200px;
      overflow: hidden;
      position: relative;
    }
    
    .course-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }
    
    .course-card:hover .course-image img {
      transform: scale(1.05);
    }
    
    .course-level {
      position: absolute;
      top: 15px;
      right: 15px;
      background: var(--primary);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .course-content {
      padding: 20px;
    }
    
    .course-title {
      font-size: 20px;
      margin-bottom: 10px;
      color: var(--dark);
      font-weight: 600;
      line-height: 1.3;
    }
    
    .course-instructor {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      color: var(--gray);
      font-size: 14px;
    }
    
    .course-instructor i {
      margin-right: 8px;
    }
    
    .course-description {
      color: var(--gray);
      margin-bottom: 20px;
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .course-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--light-gray);
    }
    
    .meta-item {
      display: flex;
      align-items: center;
      color: var(--gray);
      font-size: 14px;
    }
    
    .meta-item i {
      margin-right: 5px;
      color: var(--primary);
    }
    
    .course-price {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      text-align: center;
    }
    
    .free-badge {
      background: var(--success);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
    }
    
    .course-action {
      text-align: center;
    }
    
    .btn-enroll {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    
    .btn-enroll i {
      margin-right: 8px;
    }
    
    .btn-enroll:hover {
      background: var(--secondary);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }
    
    .footer {
      text-align: center;
      padding: 30px 0;
      color: var(--gray);
      font-size: 14px;
      border-top: 1px solid var(--light-gray);
      margin-top: 40px;
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
    }
    
    .close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
      color: var(--gray);
    }
    
    .modal-title {
      margin-bottom: 20px;
      color: var(--primary);
    }
    
    .modal-message {
      margin-bottom: 25px;
      line-height: 1.6;
    }
    
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
    }
    
    .modal-btn {
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
    }
    
    .btn-confirm {
      background: var(--success);
      color: white;
      border: none;
    }
    
    .btn-cancel {
      background: var(--light-gray);
      color: var(--dark);
      border: none;
    }
    
    /* Responsive */
    @media (max-width: 992px) {
      .filters {
        flex-direction: column;
      }
      
      .search-box {
        margin-right: 0;
        margin-bottom: 15px;
      }
      
      .filter-options {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      
      .filter-select {
        margin-right: 0;
        width: 100%;
      }
    }
    
    @media (max-width: 768px) {
      .courses-grid {
        grid-template-columns: 1fr;
      }
      
      .filter-options {
        grid-template-columns: 1fr;
      }
      
      .page-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <i class="fas fa-graduation-cap"></i>
        <span>Sakthi Learn</span>
      </div>
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">G</div>
        <div class="user-details">
          <div class="user-name" id="user-name">Guest</div>
          <div class="user-email" id="user-email"></div>
        </div>
      </div>
    </header>
    
    <h1 class="page-title">Explore Our Courses</h1>
    
    <div class="filters">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Search for courses...">
      </div>
      <div class="filter-options">
        <select class="filter-select" id="category-filter">
          <option value="">All Categories</option>
          <option value="Programming">Programming</option>
          <option value="Design">Design</option>
          <option value="Business">Business</option>
          <option value="Marketing">Marketing</option>
        </select>
        <select class="filter-select" id="level-filter">
          <option value="">All Levels</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>
    </div>
    
    <div class="courses-grid" id="courses-container">
      <!-- Courses will be inserted here by JavaScript -->
    </div>
    
    <div class="footer">
      <p>© 2023 EduLearn. All rights reserved.</p>
    </div>
  </div>
  
  <!-- Modal for messages -->
  <div class="modal" id="message-modal">
    <div class="modal-content">
      <span class="close-modal" id="close-modal">&times;</span>
      <h2 class="modal-title" id="modal-title">Message</h2>
      <p class="modal-message" id="modal-message"></p>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" id="modal-cancel">Cancel</button>
        <button class="modal-btn btn-confirm" id="modal-confirm">OK</button>
      </div>
    </div>
  </div>
  <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get elements
            const profilePicture = document.getElementById('userImage');
            const profileName = document.getElementById('profile-name');
            const profileEmail = document.getElementById('profile-email');
            const signOutBtn = document.getElementById('sign-out-btn');
            const sidebarLogoutBtn = document.getElementById('sidebar-logout-btn');

            // Get user data from localStorage
            const user = JSON.parse(localStorage.getItem('user'));
            const isLoggedIn = localStorage.getItem('isLoggedIn');

            // Check if user is logged in
            if (!user || isLoggedIn !== 'true') {
                window.location.href = 'index.html';
                return;
            }

            // Set profile data
            if (profilePicture) profilePicture.src = user.profilePicture || 'https://flowbite.com/docs/images/people/profile-picture-5.jpg';
            if (profileName) profileName.textContent = user.name || user.username || 'User';
            if (profileEmail) profileEmail.textContent = user.email || 'user@example.com';

            // Logout function
            const handleLogout = (e) => {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                localStorage.removeItem('isLoggedIn');
                window.location.href = 'index.html';
            };

            // Add event listeners
            if (signOutBtn) signOutBtn.addEventListener('click', handleLogout);
            if (sidebarLogoutBtn) sidebarLogoutBtn.addEventListener('click', handleLogout);
        });
    </script>
  <script>
    const API_BASE = "https://gameappbackend-i8zv.onrender.com";
    let allCourses = [];

    function getLoggedInUserInfo() {
      const s = localStorage.getItem('user');
      let id = 'N/A', name = 'Guest', email = '', initial = 'G';
      if (s) {
        try {
          const u = JSON.parse(s);
          id = u._id || u.id || 'N/A';
          name = u.username || u.fullName || u.name || 'Unknown';
          email = u.email || '';
          initial = name.charAt(0).toUpperCase() || 'U';
        } catch (e) {
          id = 'Error'; name = 'Error'; initial = 'E';
        }
      }
      
      // Update user info in the UI
      document.getElementById('user-avatar').textContent = initial;
      document.getElementById('user-name').textContent = name;
      if (email) {
        document.getElementById('user-email').textContent = email;
      }
      
      return { id, name, email, initial };
    }

    function showMessage(msg, type) {
      const modal = document.getElementById('message-modal');
      const modalTitle = document.getElementById('modal-title');
      const modalMessage = document.getElementById('modal-message');
      
      // Set modal style based on message type
      switch(type) {
        case 'error':
          modalTitle.style.color = '#ef476f';
          break;
        case 'success':
          modalTitle.style.color = '#06d6a0';
          break;
        case 'warning':
          modalTitle.style.color = '#ffd166';
          break;
        default:
          modalTitle.style.color = '#118ab2';
      }
      
      modalTitle.textContent = type.charAt(0).toUpperCase() + type.slice(1);
      modalMessage.textContent = msg;
      modal.style.display = 'flex';
      
      // Set up event listeners for modal buttons
      document.getElementById('modal-confirm').onclick = () => {
        modal.style.display = 'none';
      };
      
      document.getElementById('modal-cancel').onclick = () => {
        modal.style.display = 'none';
      };
      
      document.getElementById('close-modal').onclick = () => {
        modal.style.display = 'none';
      };
    }

    function createCourseCard(course) {
      const isFree = course.price === 0;
      const startDate = new Date(course.startDate);
      const endDate = new Date(course.endDate);
      
      return `
        <div class="course-card">
          <div class="course-image">
            <img src="${course.imageUrl}" alt="${course.title}">
            <div class="course-level">${course.level}</div>
          </div>
          <div class="course-content">
            <h3 class="course-title">${course.title}</h3>
            <div class="course-instructor">
              <i class="fas fa-user"></i>
              <span>${course.instructor}</span>
            </div>
            <p class="course-description">${course.description}</p>
            <div class="course-meta">
              <div class="meta-item">
                <i class="far fa-clock"></i>
                <span>${course.duration}</span>
              </div>
              <div class="meta-item">
                <i class="fas fa-layer-group"></i>
                <span>${course.category}</span>
              </div>
            </div>
            <div class="course-price">
              ${isFree ? '<span class="free-badge">FREE</span>' : `₹${course.price}`}
            </div>
            <div class="course-action">
              <button class="btn-enroll" onclick="purchaseAndStart('${encodeURIComponent(JSON.stringify(course))}')">
                <i class="fas fa-shopping-cart"></i> Enroll Now
              </button>
            </div>
          </div>
        </div>
      `;
    }

    async function fetchCourses() {
      try {
        const res = await fetch(`${API_BASE}/api/courses`);
        const data = await res.json();
        allCourses = data;
        
        const container = document.getElementById("courses-container");
        container.innerHTML = "";
        
        if (data.length === 0) {
          container.innerHTML = '<p class="no-courses">No courses available at the moment.</p>';
          return;
        }
        
        data.forEach(course => {
          const card = createCourseCard(course);
          container.innerHTML += card;
        });
      } catch (err) {
        console.error("Error fetching courses:", err);
        showMessage("Failed to load courses. Please try again later.", "error");
      }
    }

    async function purchaseAndStart(course) {
      try {
        course = JSON.parse(decodeURIComponent(course));
        const user = getLoggedInUserInfo();
        if (!user || user.id === 'N/A' || user.id === 'Error') {
          return showMessage('Please login to enroll in courses.', 'error');
        }

        const now = new Date();
        const startTime = new Date(course.startDate);
        const dueTime = new Date(course.endDate);

        if (now >= dueTime) {
          return showMessage('Course enrollment period has ended.', 'warning');
        }

        if (course.paid) { 
          if (now >= startTime) {
            sessionStorage.setItem('userId', encodeURIComponent(user.id));
            sessionStorage.setItem('mcqTypeId', encodeURIComponent(course._id));
            showMessage("Validation verified. Redirecting to course...", 'success');
            setTimeout(() => {
              window.location = `learncourse.html?userId=${encodeURIComponent(user.id)}&courseId=${encodeURIComponent(course._id)}`;
            }, 1500);
          } else {
            showMessage('You have already enrolled. The course starts soon!', 'info');
          }
          return;
        }

        if (now < startTime && course.price > 0) {
          const confirmPay = confirm(`This course starts on ${startTime.toLocaleString()}. Do you want to pay ₹${course.price} now to reserve your spot?`);
          if (!confirmPay) {
            return;
          }
        }

        if (course.price > 0) {
          const paymentId = 'PAY-' + Math.random().toString(36).substr(2, 9).toUpperCase();
          const orderId = 'ORD-' + Date.now();

          const payload = {
            userId: user.id,
            mcqTypeId: course._id,
            mcqTypeName: course.title,
            amount: course.price,
            paymentId: paymentId,
            orderId: orderId
          };

          const resp = await fetch(`${API_BASE}/api/purchase`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await resp.json();

          if (!resp.ok) {
            if (data.message && data.message.includes('You have already paid')) {
              if (now >= startTime) {
                sessionStorage.setItem('userId', encodeURIComponent(user.id));
                sessionStorage.setItem('mcqTypeId', encodeURIComponent(course._id));
                showMessage("Validation verified. Redirecting to course...", 'success');
                setTimeout(() => {
                  window.location = `learncourse.html?userId=${encodeURIComponent(user.id)}&courseId=${encodeURIComponent(course._id)}`;
                }, 1500);
              } else {
                showMessage("You already enrolled. Please wait for the course to start.", 'info');
              }
            } else if (data.message && (data.message.includes("account balance is zero") || data.message.includes("Insufficient"))) {
              showMessage('Insufficient balance. Redirecting to deposit page...', 'error');
              setTimeout(() => {
                window.location.href = "../Dashboard/payments.html";
              }, 2000);
            } else {
              showMessage(`Payment failed: ${data.message || 'Unknown error'}`, 'error');
            }
            return;
          }

          showMessage("Payment successful! You're enrolled.", 'success');
          course.paid = true; 
        }

        if (now >= startTime) {
          sessionStorage.setItem('userId', encodeURIComponent(user.id));
          sessionStorage.setItem('mcqTypeId', encodeURIComponent(course._id));
          showMessage(`Starting course: ${course.title}`, 'success');
          setTimeout(() => {
            window.location = `learncourse.html?userId=${encodeURIComponent(user.id)}&courseId=${encodeURIComponent(course._id)}`;
          }, 1500);
        } else {
          showMessage(`Enrollment successful! "${course.title}" starts on ${startTime.toLocaleString()}.`, 'info');
        }

      } catch (error) {
        console.error('Error in purchaseAndStart:', error);
        showMessage('An unexpected error occurred. Please try again.', 'error');
      }
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function() {
      getLoggedInUserInfo();
      fetchCourses();
      
      // Set up filter functionality
      const searchInput = document.getElementById('search-input');
      const categoryFilter = document.getElementById('category-filter');
      const levelFilter = document.getElementById('level-filter');
      
      const filterCourses = () => {
        const searchText = searchInput.value.toLowerCase();
        const category = categoryFilter.value;
        const level = levelFilter.value;
        
        const filteredCourses = allCourses.filter(course => {
          const matchesSearch = course.title.toLowerCase().includes(searchText) || 
                               course.description.toLowerCase().includes(searchText);
          const matchesCategory = category ? course.category === category : true;
          const matchesLevel = level ? course.level === level : true;
          
          return matchesSearch && matchesCategory && matchesLevel;
        });
        
        const container = document.getElementById("courses-container");
        container.innerHTML = "";
        
        if (filteredCourses.length === 0) {
          container.innerHTML = '<p class="no-courses">No courses match your filters.</p>';
          return;
        }
        
        filteredCourses.forEach(course => {
          const card = createCourseCard(course);
          container.innerHTML += card;
        });
      };
      
      searchInput.addEventListener('input', filterCourses);
      categoryFilter.addEventListener('change', filterCourses);
      levelFilter.addEventListener('change', filterCourses);
    });
  </script>
</body>
</html>
