<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
        }
        
        .card {
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            transition: all 0.3s ease;
        }
        
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
        
        .avatar-initial {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }
        
        .status-message {
            animation: slideIn 0.5s forwards, fadeOut 0.5s 2.5s forwards;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
  document.addEventListener('DOMContentLoaded', function() {
    // Get user data from localStorage
    const user = JSON.parse(localStorage.getItem('user'));
    const isLoggedIn = localStorage.getItem('isLoggedIn');

    // Check if user is not logged in
    if (!user || isLoggedIn !== 'true') {
      // Redirect to Home.html in the same folder
      window.location.href = '../Home.html';
      return;
    }
  });
</script>
    <div class="container mx-auto p-4 max-w-7xl">
        <!-- Navigation Tabs -->
        <ul class="flex flex-wrap text-sm font-medium text-center text-gray-500 border-b border-gray-200 mb-8">
            <li class="me-2">
                <a href="#" class="inline-block p-4 rounded-t-lg tab-active">
                    <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                </a>
            </li>
            <li class="me-2">
                <a href="testsubmitedetails.html" class="inline-block p-4 rounded-t-lg hover:text-gray-600 hover:bg-gray-50">
                    <i class="fas fa-file-alt mr-2"></i>Submit MCQ Details
                </a>
            </li>
            <li class="me-2">
                <a href="payments.html" class="inline-block p-4 rounded-t-lg hover:text-gray-600 hover:bg-gray-50">
                    <i class="fas fa-wallet mr-2"></i>Deposit
                </a>
            </li>
            <li class="me-2">
                <a href="../settings.html" class="inline-block p-4 rounded-t-lg hover:text-gray-600 hover:bg-gray-50">
                    <i class="fas fa-cog mr-2"></i>Settings
                </a>
            </li>
            <li class="me-2">
                <a href="#" class="inline-block p-4 rounded-t-lg hover:text-gray-600 hover:bg-gray-50">
                    <i class="fas fa-address-book mr-2"></i>Contacts
                </a>
            </li>
            <li class="me-2">
                <a href="WinningAmount.html" class="inline-block p-4 rounded-t-lg hover:text-gray-600 hover:bg-gray-50">
                    <i class="fas fa-address-book mr-2"></i>Winning Amount
                </a>
            </li>
        </ul>

       
</body>
</html>
