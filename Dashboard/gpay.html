<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Payment | Your Website</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .payment-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 25px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .upi-apps {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }
        .upi-app {
            flex: 1;
            min-width: 80px;
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upi-app:hover {
            border-color: #4CAF50;
            background: #f0fff0;
        }
        .upi-app img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        .upi-app span {
            display: block;
            margin-top: 5px;
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        #qr-code {
            text-align: center;
            margin: 20px 0;
            display: none;
        }
        #qr-code img {
            max-width: 200px;
            border: 1px solid #eee;
            padding: 10px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>Pay via UPI</h1>
        
        <form id="upiForm">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" placeholder="Enter amount" required>
            </div>
            
            <div class="form-group">
                <label for="upi-id">Your UPI ID</label>
                <input type="text" id="upi-id" placeholder="yourname@upi" required>
            </div>
            
            <h3>Choose UPI App</h3>
            <div class="upi-apps">
                <div class="upi-app" onclick="selectUpiApp('gpay')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Google_Pay_%28GPay%29_Logo_%282018-2020%29.svg/1200px-Google_Pay_%28GPay%29_Logo_%282018-2020%29.svg.png" alt="Google Pay">
                    <span>Google Pay</span>
                </div>
                <div class="upi-app" onclick="selectUpiApp('phonepe')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/PhonePe_Logo.svg/2560px-PhonePe_Logo.svg.png" alt="PhonePe">
                    <span>PhonePe</span>
                </div>
                <div class="upi-app" onclick="selectUpiApp('paytm')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Paytm_logo.png/800px-Paytm_logo.png" alt="Paytm">
                    <span>Paytm</span>
                </div>
                <div class="upi-app" onclick="selectUpiApp('bhim')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/BHIM_Logo.svg/1200px-BHIM_Logo.svg.png" alt="BHIM">
                    <span>BHIM</span>
                </div>
            </div>
            
            <div id="qr-code">
                <h3>Scan QR Code</h3>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=UPI_PAYMENT_LINK" alt="QR Code">
                <p>or</p>
            </div>
            
            <button type="button" onclick="initiatePayment()">Proceed to Pay</button>
        </form>
    </div>

    <script>
        let selectedApp = null;
        
        function selectUpiApp(app) {
            selectedApp = app;
            document.querySelectorAll('.upi-app').forEach(el => {
                el.style.borderColor = '#ddd';
                el.style.background = 'white';
            });
            event.currentTarget.style.borderColor = '#4CAF50';
            event.currentTarget.style.background = '#f0fff0';
        }
        
        function initiatePayment() {
            const amount = document.getElementById('amount').value;
            const upiId = document.getElementById('upi-id').value;
            
            if (!amount || !upiId) {
                alert("Please enter amount and UPI ID!");
                return;
            }
            
            if (!selectedApp) {
                alert("Please select a UPI app!");
                return;
            }
            
            // Simulate payment processing (in real case, call a backend API)
            alert(`Redirecting to ${selectedApp} to pay ₹${amount} to ${upiId}`);
            
            // Generate a UPI payment link (for demo)
            const upiLink = `upi://pay?pa=${upiId}&pn=YourWebsite&am=${amount}&cu=INR`;
            
            // Show QR Code (optional)
            document.getElementById('qr-code').style.display = 'block';
            document.querySelector('#qr-code img').src = 
                `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiLink)}`;
            
            // In a real app, you might redirect to a payment gateway or open UPI intent
            // window.location.href = upiLink;
        }
    </script>
</body>
</html>
