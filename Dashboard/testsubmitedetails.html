<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Submissions Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .card-hover:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <ul class="flex space-x-2">
                <li>
                    <a href="#" class="inline-block px-4 py-2 text-primary-600 bg-primary-50 rounded-lg font-medium">Profile</a>
                </li>
                <li>
                    <a href="payments.html" class="inline-block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium">Deposit</a>
                </li>
                <li>
                    <a href="../settings.html" class="inline-block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium">Settings</a>
                </li>
                <li>
                    <a href="#" class="inline-block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium">Contacts</a>
                </li>
            </ul>
            
            <div id="userInfo" class="flex items-center space-x-3 bg-white px-4 py-2 rounded-full shadow-sm">
                <div id="userInitial" class="w-8 h-8 rounded-full bg-primary-500 flex items-center justify-center text-white font-bold text-sm"></div>
                <div>
                    <p id="username" class="font-medium text-sm"></p>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Your Test Results</h1>
                <p class="text-gray-600">View all your test submissions and performance</p>
            </div>
            <div class="flex space-x-2">
                <button class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50">
                    <i class="fas fa-filter mr-2"></i>Filter
                </button>
                <button class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50">
                    <i class="fas fa-sort mr-2"></i>Sort
                </button>
            </div>
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary-500 mb-4"></div>
            <p class="text-gray-600">Loading your test submissions...</p>
        </div>

        <div id="error" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-8 rounded-r-lg">
            <div class="flex items-center">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <p id="errorMessage" class="font-medium"></p>
            </div>
        </div>

        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center">
            <div class="w-24 h-24 bg-primary-50 rounded-full flex items-center justify-center mb-4">
                <i class="fas fa-clipboard-list text-3xl text-primary-500"></i>
            </div>
            <h3 class="text-xl font-medium text-gray-900 mb-2">No test submissions found</h3>
            <p class="text-gray-600 max-w-md">You haven't completed any tests yet. Start a new test to see your results here.</p>
            <button class="mt-6 px-6 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                Take a Test
            </button>
        </div>

        <div id="scrollContainer" class="hidden"> 
            <div id="submissionsGallery" class="flex flex-col space-y-6">
                </div>
        </div>
    </div>

    <script>
        // Get user info from localStorage
        function getLoggedInUserInfo() {
            const userString = localStorage.getItem('user');
            let userId = 'N/A';
            let userName = 'Guest';
            let userInitial = 'G';

            if (userString) {
                try {
                    const userData = JSON.parse(userString);
                    userId = userData._id || userData.id || userData.userId || userData.userID || 'N/A';
                    userName = userData.username || userData.fullName || userData.name || 'Unknown User';
                    userInitial = userName ? userName.charAt(0).toUpperCase() : 'U';
                } catch (e) {
                    console.error('Error parsing user data:', e);
                    userName = 'Error User';
                    userId = 'Error';
                    userInitial = 'E';
                }
            }

            return {
                id: userId,
                name: userName,
                initial: userInitial
            };
        }

        // Format date to readable format
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        // Format duration from seconds to minutes:seconds
        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}m ${secs}s`;
        }

        // Get status color based on status
        function getStatusColor(status) {
            switch (status.toLowerCase()) {
                case 'completed': return 'bg-green-100 text-green-800';
                case 'in-progress': return 'bg-yellow-100 text-yellow-800';
                case 'failed': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // Get progress ring color based on percentage
        function getProgressColor(percentage) {
            if (percentage >= 80) return 'text-green-500';
            if (percentage >= 50) return 'text-blue-500';
            if (percentage >= 30) return 'text-yellow-500';
            return 'text-red-500';
        }

        // Fetch test submissions from API
        async function fetchTestSubmissions(userId) {
            try {
                const response = await fetch(`https://gameappbackend-i8zv.onrender.com/api/test-submissions/${userId}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching test submissions:', error);
                throw error;
            }
        }

        // Fetch MCQ type details from API
        async function fetchMcqTypeDetails(mcqTypeId) {
            try {
                const response = await fetch(`https://gameappbackend-i8zv.onrender.com/api/mcq-types/${mcqTypeId}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching MCQ type details:', error);
                // Return default object if fetch fails
                return {
                    _id: mcqTypeId,
                    name: "Unknown Test",
                    description: "Details not available",
                    imageUrl: "https://via.placeholder.com/150"
                };
            }
        }

        // Create progress ring SVG
        function createProgressRing(percentage, size = 60, strokeWidth = 6) {
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const strokeDashoffset = circumference - (percentage / 100) * circumference;
            const colorClass = getProgressColor(percentage);

            return `
                <div class="relative w-16 h-16"> 
                    <svg class="w-full h-full" viewBox="0 0 ${size} ${size}">
                        <circle
                            class="text-gray-200"
                            stroke-width="${strokeWidth}"
                            stroke="currentColor"
                            fill="transparent"
                            r="${radius}"
                            cx="${size/2}"
                            cy="${size/2}"
                        />
                        <circle
                            class="progress-ring__circle ${colorClass}"
                            stroke-width="${strokeWidth}"
                            stroke-dasharray="${circumference} ${circumference}"
                            stroke-dashoffset="${strokeDashoffset}"
                            stroke-linecap="round"
                            stroke="currentColor"
                            fill="transparent"
                            r="${radius}"
                            cx="${size/2}"
                            cy="${size/2}"
                        />
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span class="text-lg font-bold ${colorClass}">${percentage}%</span>
                    </div>
                </div>
            `;
        }

        // Display user info and fetch submissions when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            const userInfo = getLoggedInUserInfo();
            document.getElementById('username').textContent = userInfo.name;
            document.getElementById('userInitial').textContent = userInfo.initial;

            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');
            const scrollContainer = document.getElementById('scrollContainer');
            const galleryElement = document.getElementById('submissionsGallery');
            const emptyStateElement = document.getElementById('emptyState');

            try {
                if (userInfo.id === 'N/A' || userInfo.id === 'Error') {
                    throw new Error('User not properly logged in');
                }

                const data = await fetchTestSubmissions(userInfo.id);
                
                if (data.submissions && data.submissions.length > 0) {
                    galleryElement.innerHTML = '';

                    // Process each submission
                    for (const submission of data.submissions) {
                        // Fetch MCQ type details for each submission
                        const mcqType = await fetchMcqTypeDetails(submission.mcqTypeId);
                        
                        const card = document.createElement('div');
                        // Use w-full and add margin-bottom for spacing
                        card.className = 'w-full bg-white rounded-xl shadow-md overflow-hidden transition-all duration-300 card-hover';
                        card.innerHTML = `
                            <div class="h-40 bg-gradient-to-r from-primary-500 to-primary-600 relative overflow-hidden">
                                <div class="absolute inset-0 bg-black opacity-10"></div>
                                <div class="absolute bottom-4 left-4">
                                    <h3 class="text-xl font-bold text-white">${mcqType.name}</h3>
                                    <p class="text-primary-100 text-sm">${mcqType.description || 'Test submission'}</p>
                                </div>
                            </div>
                            <div class="p-6">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${getStatusColor(submission.status)}">
                                            ${submission.status}
                                        </span>
                                    </div>
                                    <div class="text-sm text-gray-500">
                                        ${formatDate(submission.submittedAt)}
                                    </div>
                                </div>
                                
                                <div class="flex items-center justify-between mb-6">
                                    <div>
                                        <h4 class="text-sm font-medium text-gray-500">Your Score</h4>
                                        ${createProgressRing(submission.percentage)}
                                    </div>
                                    <div class="text-center">
                                        <h4 class="text-sm font-medium text-gray-500">Duration</h4>
                                        <div class="text-2xl font-bold text-primary-600 mt-2">${formatDuration(submission.durationInSeconds)}</div>
                                    </div>
                                </div>
                                
                                <div class="border-t border-gray-100 pt-4">
                                    <div class="flex justify-between text-sm">
                                        <span class="text-gray-500">Test ID:</span>
                                        <span class="font-medium">${submission._id.substring(0, 8)}...</span>
                                    </div>
                                    <div class="flex justify-between text-sm mt-1">
                                        <span class="text-gray-500">MCQ Type:</span>
                                        <span class="font-medium">${mcqType._id.substring(0, 8)}...</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        galleryElement.appendChild(card);
                    }

                    scrollContainer.classList.remove('hidden');
                } else {
                    emptyStateElement.classList.remove('hidden');
                }
            } catch (error) {
                errorElement.classList.remove('hidden');
                document.getElementById('errorMessage').textContent = 
                    `Error loading test submissions: ${error.message}`;
            } finally {
                loadingElement.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
