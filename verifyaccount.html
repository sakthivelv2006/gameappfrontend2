<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email | Crack Quiz With Sakthi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      background-image: radial-gradient(circle at 10% 20%, rgba(107, 70, 193, 0.05) 0%, rgba(107, 70, 193, 0.05) 90%);
    }
    .gradient-bg {
      background: linear-gradient(135deg, #6b46c1 0%, #805ad5 100%);
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .input-focus:focus {
      box-shadow: 0 0 0 3px rgba(128, 90, 213, 0.3);
    }
    .btn-hover {
      transition: all 0.3s ease;
      transform: translateY(0);
    }
    .btn-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(107, 70, 193, 0.3), 0 2px 4px -1px rgba(107, 70, 193, 0.1);
    }
    .btn-active:active {
      transform: translateY(0);
    }
    .wave {
      animation: wave 2s infinite;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(5deg); }
      75% { transform: rotate(-5deg); }
    }
    .pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md animate__animated animate__fadeIn">
    <div class="gradient-bg text-white rounded-t-xl p-8 text-center relative overflow-hidden">
      <div class="absolute -bottom-10 -right-10 w-20 h-20 rounded-full bg-white opacity-10"></div>
      <div class="absolute -top-10 -left-10 w-24 h-24 rounded-full bg-white opacity-10"></div>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 text-white wave" viewBox="0 0 20 20" fill="currentColor">
        <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
        <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
      </svg>
      <h1 class="text-3xl font-bold tracking-tight">Verify Your Email</h1>
      <p class="mt-3 opacity-90 max-w-xs mx-auto">We'll send you a link to verify your email address</p>
    </div>
    
    <div class="bg-white rounded-b-xl card-shadow p-8 relative">
      <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 w-8 h-8 bg-white rotate-45"></div>
      
      <div class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
            </div>
            <input 
              type="email" 
              id="emailInput" 
              placeholder="your@email.com" 
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none input-focus transition duration-200"
            >
          </div>
        </div>
        
        <button 
          onclick="sendVerification()" 
          class="w-full gradient-bg text-white py-3 px-4 rounded-lg font-medium hover:opacity-90 btn-hover btn-active flex items-center justify-center pulse"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
          </svg>
          Send Verification Link
        </button>
        
        <p id="message" class="text-sm text-center min-h-6 transition-all duration-300"></p>
        
        <div class="text-center pt-4 border-t border-gray-100">
          <p class="text-gray-600 text-sm">Already verified? 
            <a href="https://crackquizwithsakthi.vercel.app" class="text-purple-600 font-medium hover:underline transition">Login here</a>
          </p>
        </div>
      </div>
    </div>
    
    <div class="mt-8 text-center text-xs text-gray-500">
      <p>© ${new Date().getFullYear()} Crack Quiz With Sakthi. All rights reserved.</p>
    </div>
  </div>

  <script>
    async function sendVerification() {
      const email = document.getElementById('emailInput').value;
      const message = document.getElementById('message');
      const button = document.querySelector('button');

      // Clear previous messages
      message.textContent = '';
      message.className = 'text-sm text-center min-h-6 transition-all duration-300';

      if (!email) {
        message.textContent = "Please enter your email address";
        message.className += ' text-red-500 animate__animated animate__headShake';
        return;
      }

      // Validate email format
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        message.textContent = "Please enter a valid email address";
        message.className += ' text-red-500 animate__animated animate__headShake';
        return;
      }

      try {
        // Show loading state
        button.disabled = true;
        button.classList.remove('pulse');
        button.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Sending...
        `;

        const response = await fetch('https://gameappbackend-i8zv.onrender.com/api/auth/send-verification-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
          message.textContent = data.message || "Verification link sent successfully! Please check your email.";
          message.className += ' text-green-600 animate__animated animate__fadeIn';
          
          // Add celebration effect
          button.classList.add('animate__animated', 'animate__tada');
          setTimeout(() => {
            button.classList.remove('animate__animated', 'animate__tada');
          }, 1000);
        } else {
          message.textContent = data.message || "Failed to send verification link. Please try again.";
          message.className += ' text-red-500 animate__animated animate__headShake';
        }
      } catch (err) {
        console.error(err);
        message.textContent = "Something went wrong. Please try again later.";
        message.className += ' text-red-500 animate__animated animate__headShake';
      } finally {
        button.disabled = false;
        button.classList.add('pulse');
        button.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
          </svg>
          Send Verification Link
        `;
      }
    }

    // Add animation when input is focused
    document.getElementById('emailInput').addEventListener('focus', function() {
      this.parentElement.classList.add('animate__animated', 'animate__pulse');
    });
    
    document.getElementById('emailInput').addEventListener('blur', function() {
      this.parentElement.classList.remove('animate__animated', 'animate__pulse');
    });
  </script>
</body>
</html>
