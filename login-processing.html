<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            font-family: sans-serif;
            color: #333;
        }
        .message-box {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="message-box">
        <div class="spinner"></div>
        <p class="text-lg font-semibold" id="loginStatus">Processing your login...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Backend configuration
            const BACKEND_BASE_URL = 'https://gameappbackend-i8zv.onrender.com/api';
            
            const loginStatusElement = document.getElementById('loginStatus');

            const email = localStorage.getItem('tempLoginEmail');
            const password = localStorage.getItem('tempLoginPassword');

            localStorage.removeItem('tempLoginEmail');
            localStorage.removeItem('tempLoginPassword');

            if (!email || !password) {
                loginStatusElement.textContent = 'Login details missing. Redirecting to login page...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }

            try {
                const response = await fetch(`${BACKEND_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('isLoggedIn', 'true');

                    loginStatusElement.textContent = 'Login successful! Redirecting to settings...';
                    setTimeout(() => {
                        window.location.href = 'settings.html';
                    }, 1500);
                } else {
                    loginStatusElement.textContent = `Login failed: ${data.message || 'Invalid credentials'}. Redirecting...`;
                    localStorage.removeItem('isLoggedIn');
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                }
            } catch (error) {
                console.error('Network or login error:', error);
                loginStatusElement.textContent = 'Network error or unable to log in. Redirecting...';
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
