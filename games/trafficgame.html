<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme Road Racer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes roadMovement {
            0% { background-position: 0 0; }
            100% { background-position: 0 1000px; }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .blink {
            animation: blink 0.5s linear infinite;
        }
        
        .game-container {
            perspective: 1000px;
        }
        
        .road {
            animation: roadMovement 5s linear infinite;
            background-image: 
                linear-gradient(90deg, #555 0%, #555 10%, #777 10%, #777 20%, #555 20%, #555 30%, #777 30%, #777 40%, #555 40%, #555 50%, #777 50%, #777 60%, #555 60%, #555 70%, #777 70%, #777 80%, #555 80%, #555 90%, #777 90%, #777 100%),
                linear-gradient(#333 0%, #333 100%);
            background-size: 60px 60px, 100% 100%;
            background-repeat: repeat;
        }
        
        .car {
            transition: transform 0.1s ease;
        }
        
        .traffic-car {
            transition: transform 0.05s linear;
        }
        
        .explosion {
            background-image: radial-gradient(circle, #ff0, #f80, #f00);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s, transform 0.5s;
        }
        
        .score-pop {
            animation: scorePop 0.5s ease-out forwards;
        }
        
        @keyframes scorePop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-mono overflow-hidden">
    <div class="game-container w-full h-screen flex flex-col items-center justify-center relative">
        <!-- Start Screen -->
        <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-80 z-50">
            <h1 class="text-6xl font-bold mb-8 text-yellow-400">EXTREME ROAD RACER</h1>
            <div class="text-xl mb-12 text-center max-w-md">
                <p class="mb-4">Avoid traffic and survive as long as you can!</p>
                <p>Use <span class="text-yellow-400">LEFT</span> and <span class="text-yellow-400">RIGHT</span> arrow keys to move</p>
            </div>
            <button id="startButton" class="px-8 py-4 bg-green-600 hover:bg-green-700 rounded-lg text-2xl font-bold transition-all transform hover:scale-105">
                START GAME
            </button>
            <div class="mt-12 text-gray-400">
                <p>High Score: <span id="highScoreDisplay" class="text-yellow-400">0</span></p>
            </div>
        </div>
        
        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-80 z-40 hidden">
            <h1 class="text-6xl font-bold mb-8 text-red-500">GAME OVER</h1>
            <div class="text-3xl mb-8">
                Your Score: <span id="finalScore" class="text-yellow-400">0</span>
            </div>
            <div class="text-xl mb-8">
                High Score: <span id="newHighScore" class="text-green-400">0</span>
            </div>
            <button id="restartButton" class="px-8 py-4 bg-blue-600 hover:bg-blue-700 rounded-lg text-2xl font-bold transition-all transform hover:scale-105">
                PLAY AGAIN
            </button>
        </div>
        
        <!-- Pause Screen -->
        <div id="pauseScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-80 z-30 hidden">
            <h1 class="text-6xl font-bold mb-8 text-blue-400">PAUSED</h1>
            <div class="text-2xl mb-12">
                Score: <span id="pausedScore" class="text-yellow-400">0</span>
            </div>
            <button id="resumeButton" class="px-8 py-4 bg-green-600 hover:bg-green-700 rounded-lg text-2xl font-bold transition-all transform hover:scale-105 mb-4">
                RESUME
            </button>
            <button id="quitButton" class="px-8 py-4 bg-red-600 hover:bg-red-700 rounded-lg text-xl font-bold transition-all transform hover:scale-105">
                QUIT TO MENU
            </button>
        </div>
        
        <!-- Game UI -->
        <div class="absolute top-4 left-4 z-20 flex space-x-8">
            <div class="bg-black bg-opacity-70 px-4 py-2 rounded-lg">
                Score: <span id="scoreDisplay" class="text-yellow-400">0</span>
            </div>
            <div class="bg-black bg-opacity-70 px-4 py-2 rounded-lg">
                Level: <span id="levelDisplay" class="text-green-400">1</span>
            </div>
            <div class="bg-black bg-opacity-70 px-4 py-2 rounded-lg">
                Lives: <span id="livesDisplay" class="text-red-400">❤️ ❤️ ❤️</span>
            </div>
        </div>
        
        <!-- Pause Button -->
        <button id="pauseButton" class="absolute top-4 right-4 z-20 bg-black bg-opacity-70 px-4 py-2 rounded-lg hover:bg-opacity-90 transition">
            Pause
        </button>
        
        <!-- Game Area -->
        <div id="gameArea" class="relative w-full max-w-md h-3/4 bg-gray-800 overflow-hidden rounded-lg border-4 border-gray-700">
            <!-- Road -->
            <div id="road" class="road w-full h-full relative"></div>
            
            <!-- Player Car -->
            <div id="playerCar" class="car absolute bottom-10 left-1/2 transform -translate-x-1/2 w-12 h-20 bg-red-600 rounded-lg z-10">
                <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-8 h-2 bg-red-700 rounded-sm"></div>
                <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-10 h-2 bg-black rounded-sm"></div>
                <div class="absolute top-1/4 left-1 w-2 h-8 bg-red-800 rounded-sm"></div>
                <div class="absolute top-1/4 right-1 w-2 h-8 bg-red-800 rounded-sm"></div>
                <div class="absolute top-1/2 left-1/4 w-2 h-2 bg-yellow-300 rounded-full"></div>
                <div class="absolute top-1/2 right-1/4 w-2 h-2 bg-yellow-300 rounded-full"></div>
            </div>
            
            <!-- Traffic Cars will be added here dynamically -->
        </div>
        
        <!-- Controls Info -->
        <div class="mt-4 text-gray-400 text-sm">
            Arrow keys to move | P to pause
        </div>
        
        <!-- Debug Info (can be removed in production) -->
        <div id="debugInfo" class="absolute bottom-2 left-2 text-xs text-gray-500 hidden">
            FPS: <span id="fpsCounter">0</span> | Cars: <span id="carCount">0</span>
        </div>
    </div>

    <script>
        // Game State
        const gameState = {
            running: false,
            paused: false,
            score: 0,
            highScore: localStorage.getItem('highScore') || 0,
            level: 1,
            lives: 3,
            speed: 5,
            trafficSpeed: 3,
            spawnRate: 2000,
            lastSpawnTime: 0,
            lastFrameTime: 0,
            fps: 0,
            frameCount: 0,
            lastFpsUpdate: 0,
            keys: {
                ArrowLeft: false,
                ArrowRight: false,
                ArrowUp: false,
                ArrowDown: false
            },
            playerPosition: 2, // 1, 2, or 3 (left, center, right)
            trafficCars: [],
            animations: []
        };

        // DOM Elements
        const elements = {
            startScreen: document.getElementById('startScreen'),
            gameOverScreen: document.getElementById('gameOverScreen'),
            pauseScreen: document.getElementById('pauseScreen'),
            gameArea: document.getElementById('gameArea'),
            road: document.getElementById('road'),
            playerCar: document.getElementById('playerCar'),
            scoreDisplay: document.getElementById('scoreDisplay'),
            highScoreDisplay: document.getElementById('highScoreDisplay'),
            finalScore: document.getElementById('finalScore'),
            newHighScore: document.getElementById('newHighScore'),
            pausedScore: document.getElementById('pausedScore'),
            levelDisplay: document.getElementById('levelDisplay'),
            livesDisplay: document.getElementById('livesDisplay'),
            startButton: document.getElementById('startButton'),
            restartButton: document.getElementById('restartButton'),
            pauseButton: document.getElementById('pauseButton'),
            resumeButton: document.getElementById('resumeButton'),
            quitButton: document.getElementById('quitButton'),
            debugInfo: document.getElementById('debugInfo'),
            fpsCounter: document.getElementById('fpsCounter'),
            carCount: document.getElementById('carCount')
        };

        // Event Listeners
        elements.startButton.addEventListener('click', startGame);
        elements.restartButton.addEventListener('click', startGame);
        elements.pauseButton.addEventListener('click', togglePause);
        elements.resumeButton.addEventListener('click', togglePause);
        elements.quitButton.addEventListener('click', quitToMenu);

        document.addEventListener('keydown', (e) => {
            if (e.key in gameState.keys) {
                gameState.keys[e.key] = true;
                e.preventDefault();
            }
            
            // Pause with P key
            if (e.key === 'p' && gameState.running) {
                togglePause();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key in gameState.keys) {
                gameState.keys[e.key] = false;
                e.preventDefault();
            }
        });

        // Initialize high score display
        elements.highScoreDisplay.textContent = gameState.highScore;

        // Game Functions
        function startGame() {
            // Reset game state
            gameState.running = true;
            gameState.paused = false;
            gameState.score = 0;
            gameState.level = 1;
            gameState.lives = 3;
            gameState.speed = 5;
            gameState.trafficSpeed = 3;
            gameState.spawnRate = 2000;
            gameState.playerPosition = 2;
            gameState.trafficCars = [];
            gameState.animations = [];
            
            // Clear any existing traffic cars
            document.querySelectorAll('.traffic-car').forEach(car => car.remove());
            
            // Update UI
            elements.scoreDisplay.textContent = '0';
            elements.levelDisplay.textContent = '1';
            updateLivesDisplay();
            
            // Hide screens
            elements.startScreen.classList.add('hidden');
            elements.gameOverScreen.classList.add('hidden');
            elements.pauseScreen.classList.add('hidden');
            
            // Start game loop
            gameState.lastFrameTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (!gameState.running) return;
            if (gameState.paused) {
                gameState.lastFrameTime = timestamp;
                requestAnimationFrame(gameLoop);
                return;
            }
            
            // Calculate delta time and FPS
            const deltaTime = timestamp - gameState.lastFrameTime;
            gameState.lastFrameTime = timestamp;
            gameState.frameCount++;
            
            if (timestamp - gameState.lastFpsUpdate >= 1000) {
                gameState.fps = Math.round((gameState.frameCount * 1000) / (timestamp - gameState.lastFpsUpdate));
                gameState.frameCount = 0;
                gameState.lastFpsUpdate = timestamp;
                
                if (elements.debugInfo.classList.contains('hidden') === false) {
                    elements.fpsCounter.textContent = gameState.fps;
                    elements.carCount.textContent = gameState.trafficCars.length;
                }
            }
            
            // Handle input
            handleInput();
            
            // Spawn traffic
            if (timestamp - gameState.lastSpawnTime > gameState.spawnRate) {
                spawnTrafficCar();
                gameState.lastSpawnTime = timestamp;
            }
            
            // Update traffic cars
            updateTrafficCars(deltaTime);
            
            // Update animations
            updateAnimations(deltaTime);
            
            // Check collisions
            checkCollisions();
            
            // Update score
            updateScore(deltaTime);
            
            // Continue the game loop
            requestAnimationFrame(gameLoop);
        }

        function handleInput() {
            if (gameState.keys.ArrowLeft && gameState.playerPosition > 1) {
                gameState.playerPosition--;
                updatePlayerPosition();
            }
            if (gameState.keys.ArrowRight && gameState.playerPosition < 3) {
                gameState.playerPosition++;
                updatePlayerPosition();
            }
            
            // Speed control (not used in basic version)
            if (gameState.keys.ArrowUp) {
                // Increase speed
            }
            if (gameState.keys.ArrowDown) {
                // Decrease speed
            }
        }

        function updatePlayerPosition() {
            let position;
            switch (gameState.playerPosition) {
                case 1: position = 'left-1/4'; break;
                case 2: position = 'left-1/2'; break;
                case 3: position = 'left-3/4'; break;
            }
            
            // Remove all positioning classes
            elements.playerCar.classList.remove('left-1/4', 'left-1/2', 'left-3/4');
            // Add the new position class
            elements.playerCar.classList.add(position);
        }

        function spawnTrafficCar() {
            // Random lane (1, 2, or 3)
            const lane = Math.floor(Math.random() * 3) + 1;
            
            // Random car type/color
            const carTypes = [
                'bg-blue-500', 'bg-green-500', 'bg-yellow-500', 
                'bg-purple-500', 'bg-pink-500', 'bg-indigo-500'
            ];
            const carColor = carTypes[Math.floor(Math.random() * carTypes.length)];
            
            // Create car element
            const car = document.createElement('div');
            car.className = `traffic-car absolute w-12 h-20 ${carColor} rounded-lg z-10`;
            
            // Position the car
            let position;
            switch (lane) {
                case 1: position = 'left-1/4'; break;
                case 2: position = 'left-1/2'; break;
                case 3: position = 'left-3/4'; break;
            }
            car.classList.add(position, 'top-0', 'transform', '-translate-x-1/2');
            
            // Add some details to the car
            car.innerHTML = `
                <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-8 h-2 ${carColor.replace('500', '700')} rounded-sm"></div>
                <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-10 h-2 bg-black rounded-sm"></div>
                <div class="absolute top-1/4 left-1 w-2 h-8 ${carColor.replace('500', '800')} rounded-sm"></div>
                <div class="absolute top-1/4 right-1 w-2 h-8 ${carColor.replace('500', '800')} rounded-sm"></div>
            `;
            
            // Add to game area
            elements.gameArea.appendChild(car);
            
            // Add to traffic cars array
            gameState.trafficCars.push({
                element: car,
                lane: lane,
                y: 0,
                speed: gameState.trafficSpeed * (0.8 + Math.random() * 0.4) // Random speed variation
            });
        }

        function updateTrafficCars(deltaTime) {
            const carsToRemove = [];
            
            gameState.trafficCars.forEach((car, index) => {
                // Move car down
                car.y += car.speed * (deltaTime / 16); // Normalize to ~60fps
                car.element.style.top = `${car.y}px`;
                
                // Check if car is out of bounds
                if (car.y > elements.gameArea.offsetHeight) {
                    carsToRemove.push(index);
                    
                    // Add score for avoiding a car
                    addScore(10);
                    
                    // Show score pop effect
                    const scorePop = document.createElement('div');
                    scorePop.className = 'absolute text-yellow-400 font-bold score-pop';
                    scorePop.textContent = '+10';
                    scorePop.style.left = car.element.style.left;
                    scorePop.style.top = `${elements.gameArea.offsetHeight - 30}px`;
                    elements.gameArea.appendChild(scorePop);
                    
                    // Remove after animation
                    setTimeout(() => {
                        scorePop.remove();
                    }, 500);
                }
            });
            
            // Remove cars that are out of bounds (in reverse order to avoid index issues)
            carsToRemove.reverse().forEach(index => {
                gameState.trafficCars[index].element.remove();
                gameState.trafficCars.splice(index, 1);
            });
        }

        function checkCollisions() {
            const playerRect = elements.playerCar.getBoundingClientRect();
            
            gameState.trafficCars.forEach(car => {
                const carRect = car.element.getBoundingClientRect();
                
                // Simple collision detection
                if (
                    playerRect.left < carRect.right &&
                    playerRect.right > carRect.left &&
                    playerRect.top < carRect.bottom &&
                    playerRect.bottom > carRect.top
                ) {
                    handleCollision(car);
                }
            });
        }

        function handleCollision(car) {
            // Remove the traffic car
            car.element.remove();
            gameState.trafficCars = gameState.trafficCars.filter(c => c !== car);
            
            // Create explosion effect
            const explosion = document.createElement('div');
            explosion.className = 'explosion absolute w-16 h-16 z-20';
            explosion.style.left = `${elements.playerCar.offsetLeft - 8}px`;
            explosion.style.top = `${elements.playerCar.offsetTop - 8}px`;
            elements.gameArea.appendChild(explosion);
            
            // Trigger explosion animation
            setTimeout(() => {
                explosion.style.opacity = '0.8';
                explosion.style.transform = 'scale(1.5)';
                
                setTimeout(() => {
                    explosion.remove();
                }, 300);
            }, 10);
            
            // Make player car blink
            elements.playerCar.classList.add('blink');
            setTimeout(() => {
                elements.playerCar.classList.remove('blink');
            }, 1000);
            
            // Lose a life
            gameState.lives--;
            updateLivesDisplay();
            
            if (gameState.lives <= 0) {
                gameOver();
            }
        }

        function updateScore(deltaTime) {
            // Add score based on time survived and speed
            const scoreToAdd = (gameState.speed * deltaTime) / 100;
            addScore(scoreToAdd);
            
            // Level up based on score
            const newLevel = Math.floor(gameState.score / 1000) + 1;
            if (newLevel > gameState.level) {
                gameState.level = newLevel;
                elements.levelDisplay.textContent = gameState.level;
                
                // Increase difficulty
                gameState.speed = 5 + gameState.level * 0.5;
                gameState.trafficSpeed = 3 + gameState.level * 0.3;
                gameState.spawnRate = Math.max(500, 2000 - gameState.level * 100);
                
                // Show level up message
                const levelUp = document.createElement('div');
                levelUp.className = 'absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-4xl font-bold text-green-400 z-30';
                levelUp.textContent = `LEVEL ${gameState.level}!`;
                elements.gameArea.appendChild(levelUp);
                
                // Remove after animation
                setTimeout(() => {
                    levelUp.style.opacity = '0';
                    levelUp.style.transform = 'translate(-50%, -50%) scale(1.2)';
                    setTimeout(() => {
                        levelUp.remove();
                    }, 500);
                }, 1000);
            }
        }

        function addScore(amount) {
            gameState.score += amount;
            elements.scoreDisplay.textContent = Math.floor(gameState.score);
        }

        function updateLivesDisplay() {
            let livesText = '';
            for (let i = 0; i < 3; i++) {
                livesText += i < gameState.lives ? '❤️ ' : '♡ ';
            }
            elements.livesDisplay.textContent = livesText.trim();
        }

        function updateAnimations(deltaTime) {
            // In a more complex game, we'd update all active animations here
        }

        function gameOver() {
            gameState.running = false;
            
            // Update high score
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('highScore', gameState.highScore);
                elements.newHighScore.textContent = gameState.highScore;
                elements.newHighScore.classList.add('text-green-400');
                elements.newHighScore.classList.remove('text-yellow-400');
            } else {
                elements.newHighScore.textContent = gameState.highScore;
                elements.newHighScore.classList.add('text-yellow-400');
                elements.newHighScore.classList.remove('text-green-400');
            }
            
            // Show final score
            elements.finalScore.textContent = Math.floor(gameState.score);
            
            // Show game over screen
            elements.gameOverScreen.classList.remove('hidden');
        }

        function togglePause() {
            if (!gameState.running) return;
            
            gameState.paused = !gameState.paused;
            
            if (gameState.paused) {
                elements.pausedScore.textContent = Math.floor(gameState.score);
                elements.pauseScreen.classList.remove('hidden');
                elements.road.style.animationPlayState = 'paused';
            } else {
                elements.pauseScreen.classList.add('hidden');
                elements.road.style.animationPlayState = 'running';
            }
        }

        function quitToMenu() {
            gameState.running = false;
            gameState.paused = false;
            
            elements.pauseScreen.classList.add('hidden');
            elements.gameOverScreen.classList.add('hidden');
            elements.startScreen.classList.remove('hidden');
            
            // Update high score display
            elements.highScoreDisplay.textContent = gameState.highScore;
        }

        // Debug: Press D to show debug info
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd') {
                elements.debugInfo.classList.toggle('hidden');
            }
        });
    </script>
</body>
</html>
