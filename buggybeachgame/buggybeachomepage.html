<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Buggy Racing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Nunito:wght@600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #87CEEB 0%, #4682B4 100%);
            position: relative;
            height: 100vh;
        }

        /* Animated background clouds */
        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            opacity: 0.7;
            animation: float 20s infinite linear;
        }

        .cloud:before {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
        }

        .cloud:after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 20%;
            animation-duration: 25s;
        }

        .cloud1:before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1:after {
            width: 60px;
            height: 20px;
            top: -10px;
            right: 10px;
        }

        .cloud2 {
            width: 80px;
            height: 30px;
            top: 40%;
            animation-duration: 30s;
            animation-delay: -10s;
        }

        .cloud2:before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 15px;
        }

        .cloud2:after {
            width: 50px;
            height: 15px;
            top: -5px;
            right: 15px;
        }

        @keyframes float {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }

        /* Main container */
        .game-container {
            position: relative;
            z-index: 2;
            height: 100vh;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.1) 100%);
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .back-btn {
            background: linear-gradient(145deg, #2196F3, #1976D2);
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.6);
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-item {
            background: linear-gradient(145deg, #2196F3, #1565C0);
            border-radius: 25px;
            padding: 10px 20px;
            color: white;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            min-width: 80px;
            justify-content: center;
        }

        .trophy::before { content: '🏆'; }
        .percentage::before { content: '📊'; }
        .gift::before { content: '🎁'; }
        .coins::before { content: '🪙'; }
        .gems::before { content: '💎'; }
        .tickets::before { content: '🎫'; }

        /* Main scene */
        .main-scene {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 200px);
            perspective: 1000px;
        }

        .village-scene {
            position: relative;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at center bottom, #8B4513 0%, transparent 40%),
                linear-gradient(180deg, transparent 60%, #D2B48C 100%);
        }

        /* Buildings */
        .building {
            position: absolute;
            bottom: 20%;
        }

        .building-left {
            left: 10%;
            width: 200px;
            height: 120px;
            background: linear-gradient(145deg, #A0A0A0, #808080);
            clip-path: polygon(0 100%, 0 30%, 20% 0%, 80% 0%, 100% 30%, 100% 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .building-right {
            right: 10%;
            width: 180px;
            height: 100px;
            background: linear-gradient(145deg, #B0B0B0, #707070);
            clip-path: polygon(0 100%, 0 40%, 15% 0%, 85% 0%, 100% 40%, 100% 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Character and buggy */
        .character-section {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 30px;
        }

        .buggy {
            width: 200px;
            height: 100px;
            position: relative;
            animation: bounce 3s ease-in-out infinite;
        }

        .buggy-body {
            width: 140px;
            height: 60px;
            background: linear-gradient(145deg, #4CAF50, #2E7D32);
            border-radius: 20px;
            position: relative;
            border: 4px solid #1B5E20;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .buggy-windshield {
            width: 80px;
            height: 30px;
            background: linear-gradient(145deg, rgba(135, 206, 235, 0.8), rgba(70, 130, 180, 0.8));
            border-radius: 15px 15px 0 0;
            position: absolute;
            top: -25px;
            left: 30px;
            border: 2px solid #4682B4;
        }

        .wheel {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #333 0%, #000 100%);
            border-radius: 50%;
            position: absolute;
            bottom: -20px;
            border: 3px solid #666;
            animation: spin 2s linear infinite;
        }

        .wheel-front { right: -10px; }
        .wheel-back { left: -10px; }

        .character {
            width: 80px;
            height: 120px;
            position: relative;
            animation: wave 2s ease-in-out infinite alternate;
        }

        .character-head {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #FFDBAC, #F4A460);
            border-radius: 50%;
            position: relative;
            margin: 0 auto;
            border: 3px solid #D2691E;
        }

        .character-helmet {
            width: 55px;
            height: 30px;
            background: linear-gradient(145deg, #DC143C, #8B0000);
            border-radius: 50% 50% 0 0;
            position: absolute;
            top: -15px;
            left: -2.5px;
            border: 2px solid #800000;
        }

        .character-goggles {
            width: 40px;
            height: 15px;
            background: linear-gradient(145deg, #FFD700, #FFA500);
            border-radius: 20px;
            position: absolute;
            top: 15px;
            left: 5px;
            border: 2px solid #FF8C00;
        }

        .character-body {
            width: 60px;
            height: 70px;
            background: linear-gradient(145deg, #8B4513, #A0522D);
            border-radius: 10px;
            margin: 10px auto 0;
            border: 2px solid #654321;
        }

        /* Palm tree */
        .palm-tree {
            position: absolute;
            bottom: 30%;
            left: 35%;
            width: 60px;
            height: 150px;
        }

        .palm-trunk {
            width: 20px;
            height: 100px;
            background: linear-gradient(145deg, #8B4513, #654321);
            margin: 0 auto;
            border-radius: 10px;
        }

        .palm-leaves {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .palm-leaf {
            width: 80px;
            height: 30px;
            background: linear-gradient(145deg, #228B22, #006400);
            border-radius: 50px;
            position: absolute;
            transform-origin: 10px center;
        }

        .palm-leaf:nth-child(1) { transform: translateX(-50%) rotate(-30deg); }
        .palm-leaf:nth-child(2) { transform: translateX(-50%) rotate(30deg); }
        .palm-leaf:nth-child(3) { transform: translateX(-50%) rotate(-60deg); }
        .palm-leaf:nth-child(4) { transform: translateX(-50%) rotate(60deg); }

        /* Bottom controls */
        .bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.2) 100%);
        }

        .control-btn {
            background: linear-gradient(145deg, #2196F3, #1565C0);
            border: none;
            border-radius: 20px;
            padding: 15px 20px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 100px;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.6);
        }

        .control-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .race-btn {
            background: linear-gradient(145deg, #FF5722, #D84315);
            box-shadow: 0 6px 20px rgba(255, 87, 34, 0.4);
            font-size: 18px;
            padding: 20px 30px;
            border-radius: 50px;
            position: relative;
            overflow: hidden;
        }

        .race-btn:hover {
            box-shadow: 0 8px 25px rgba(255, 87, 34, 0.6);
        }

        .race-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .race-btn:hover::before {
            left: 100%;
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes wave {
            from { transform: rotate(-2deg); }
            to { transform: rotate(2deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .top-bar {
                padding: 15px;
            }
            
            .stats-bar {
                gap: 8px;
            }
            
            .stat-item {
                padding: 8px 12px;
                font-size: 14px;
                min-width: 60px;
            }
            
            .building-left, .building-right {
                width: 120px;
                height: 80px;
            }
            
            .buggy {
                width: 150px;
                height: 75px;
            }
            
            .buggy-body {
                width: 105px;
                height: 45px;
            }
            
            .character {
                width: 60px;
                height: 90px;
            }
            
            .bottom-controls {
                padding: 15px;
            }
            
            .control-btn {
                padding: 10px 15px;
                min-width: 80px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <div class="game-container">
        <div class="top-bar">
            <button class="back-btn" onclick="goBack()">
                ◀ Back
            </button>
            
            <div class="stats-bar">
                <div class="stat-item trophy">14/48</div>
                <div class="stat-item percentage">20%</div>
                <div class="stat-item gift"></div>
                <div class="stat-item coins">79,201</div>
                <div class="stat-item gems">62</div>
                <div class="stat-item tickets">5</div>
            </div>
        </div>

        <div class="main-scene">
            <div class="village-scene">
                <div class="building building-left"></div>
                <div class="building building-right"></div>
                
                <div class="palm-tree">
                    <div class="palm-trunk"></div>
                    <div class="palm-leaves">
                        <div class="palm-leaf"></div>
                        <div class="palm-leaf"></div>
                        <div class="palm-leaf"></div>
                        <div class="palm-leaf"></div>
                    </div>
                </div>

                <div class="character-section">
                    <div class="character">
                        <div class="character-head">
                            <div class="character-helmet"></div>
                            <div class="character-goggles"></div>
                        </div>
                        <div class="character-body"></div>
                    </div>
                    
                    <div class="buggy">
                        <div class="buggy-body">
                            <div class="buggy-windshield"></div>
                        </div>
                        <div class="wheel wheel-front"></div>
                        <div class="wheel wheel-back"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-controls">
            <button class="control-btn" onclick="upgrade()">
                <div class="control-icon">🔧</div>
                Upgrade
            </button>
            
            <button class="control-btn" onclick="powerups()">
                <div class="control-icon">❓</div>
                Powerups
            </button>
            
            <button class="control-btn" onclick="switchCar()">
                <div class="control-icon">🚗</div>
                Switch Car
            </button>
            
            <button class="control-btn" onclick="switchDriver()">
                <div class="control-icon">👤</div>
                Switch Driver
            </button>
            
            <a href="buggybeachchooseseries.html" class="control-btn race-btn">
    <div class="control-icon">🏁</div>
    Choose Series
</a>

        </div>
    </div>

    <script>
        // Game functions
        function goBack() {
            alert('Going back to main menu...');
        }

        function upgrade() {
            alert('Opening upgrade menu...');
        }

        function powerups() {
            alert('Opening powerups menu...');
        }

        function switchCar() {
            alert('Opening car selection...');
        }

        function switchDriver() {
            alert('Opening driver selection...');
        }

        function chooseSeries() {
            alert('Starting race series selection...');
        }

        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', function() {
            // Add floating animation to buildings
            const buildings = document.querySelectorAll('.building');
            buildings.forEach((building, index) => {
                building.style.animation = `bounce ${3 + index}s ease-in-out infinite`;
                building.style.animationDelay = `${index * 0.5}s`;
            });

            // Add click effects to stat items
            const statItems = document.querySelectorAll('.stat-item');
            statItems.forEach(item => {
                item.addEventListener('click', function() {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                    }, 150);
                });
            });

            // Add sparkle effect to coins and gems
            const coins = document.querySelector('.coins');
            const gems = document.querySelector('.gems');
            
            setInterval(() => {
                [coins, gems].forEach(item => {
                    item.style.boxShadow = '0 4px 15px rgba(255, 215, 0, 0.6)';
                    setTimeout(() => {
                        item.style.boxShadow = '0 4px 15px rgba(33, 150, 243, 0.3)';
                    }, 500);
                });
            }, 2000);
        });

        // Add keyboard controls
        document.addEventListener('keydown', function(event) {
            switch(event.key) {
                case 'Escape':
                    goBack();
                    break;
                case '1':
                    upgrade();
                    break;
                case '2':
                    powerups();
                    break;
                case '3':
                    switchCar();
                    break;
                case '4':
                    switchDriver();
                    break;
                case 'Enter':
                case ' ':
                    chooseSeries();
                    break;
            }
        });
    </script>
</body>
</html>
